# NEXA server only. AD, krouter, OpenMetadata, Cube and ClickHouse are external
# services reached through the NEXA_* variables in .env (copy .env.example).
services:
  nexa-server:
    build: .
    env_file: .env
    ports:
      - "${NEXA_PORT:-8000}:${NEXA_PORT:-8000}"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Admin panel database (allow-list, saved settings, audit log). Back this volume up.
      - nexa-data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Also mount ./certs:/certs:ro under volumes for the LDAP CA file / TLS certificate.
    healthcheck:
      # Switch to https:// (and disable verification) if NEXA_TLS_CERT_FILE is set.
      test: ["CMD", "python", "-c", "import os,urllib.request as u; u.urlopen('http://127.0.0.1:'+os.environ.get('NEXA_PORT','8000')+'/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nexa-data:
